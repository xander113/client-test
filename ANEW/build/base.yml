asar: true
publish: null
afterPack: ./build/pack-native.mjs
artifactName: "${productName}-${version}-${arch}.${ext}"
files:
  - dist/**/*
  - desktop/**/*
  - build/icons/*.png
  - package.json
win:
  target:
    - target: nsis
      arch: [x64, arm64]
nsis:
  artifactName: "${productName}-${version}-Setup.${ext}"
mac:
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
