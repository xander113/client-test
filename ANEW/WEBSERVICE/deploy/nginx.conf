map $http_upgrade $pot_upgrade_connection {
    default upgrade;
    '' close;
}
log_format pot '$remote_addr $request_method $uri $status $request_time';
resolver 127.0.0.11 valid=5s ipv6=off;
upstream pot_php {
    zone pot_php 64k;
    server web:9000 resolve;
}
upstream pot_core {
    zone pot_core 64k;
    server worker:4831 resolve;
}

server {
    listen 8080 default_server;
    root /var/www/pot/public;
    server_tokens off;
    access_log /var/log/nginx/access.log pot;
    client_max_body_size 2m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'none'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location ^~ /v3/internal/ { return 404; }

    location = /v3/instances/core/socket {
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $pot_upgrade_connection;
        proxy_set_header Host $host;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
        proxy_buffering off;
        proxy_pass http://pot_core;
    }

    location = /pot.css {
        alias /var/www/pot/public/pot.css;
        expires 1h;
    }

    location / {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/pot/public/index.php;
        fastcgi_param HTTP_PROXY "";
        fastcgi_pass pot_php;
    }
}

server {
    listen 8081;
    server_tokens off;
    access_log off;
    client_max_body_size 64k;

    location ^~ /v3/internal/ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/pot/public/index.php;
        fastcgi_param HTTP_PROXY "";
        fastcgi_pass pot_php;
    }
    location / { return 404; }
}
