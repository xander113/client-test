<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'none'; object-src 'none'; base-uri 'none'">
  <title>Pot Client</title>
  <link rel="stylesheet" href="../common/shell.css">
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./main.js"></script>
</head>
<body>
  <svg class="icon-sheet" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
    <symbol id="icon-mark" viewBox="0 0 24 24">
      <path d="M5 8h14l-1.8 11H6.8L5 8Zm-1-4h16v2H4Z" fill="currentColor" stroke="none"/>
      <path d="M11 12h2v2h-2Z" fill="var(--green)" stroke="none"/>
    </symbol>
    <symbol id="icon-grid" viewBox="0 0 24 24">
      <rect x="3.5" y="3.5" width="6.5" height="6.5" rx="1.35"/>
      <rect x="14" y="3.5" width="6.5" height="6.5" rx="1.35"/>
      <rect x="3.5" y="14" width="6.5" height="6.5" rx="1.35"/>
      <rect x="14" y="14" width="6.5" height="6.5" rx="1.35"/>
    </symbol>
    <symbol id="icon-keyboard" viewBox="0 0 24 24">
      <rect x="2.5" y="5.5" width="19" height="13" rx="2.5"/>
      <path d="M6.5 10h.1m3.5 0h.1m3.5 0h.1m3.5 0h.1M6.5 14h.1m3.5 0h7.3"/>
    </symbol>
    <symbol id="icon-play" viewBox="0 0 24 24">
      <path class="fill-icon" d="m8 5.5 11 6.5-11 6.5z"/>
    </symbol>
    <symbol id="icon-players" viewBox="0 0 24 24">
      <circle cx="9" cy="7" r="3"/>
      <path d="M3 20v-1.2A4.8 4.8 0 0 1 7.8 14h2.4a4.8 4.8 0 0 1 4.8 4.8V20m1-15.8a3 3 0 0 1 0 5.8m5 10v-1.2a4.8 4.8 0 0 0-3.5-4.6"/>
    </symbol>
    <symbol id="icon-back" viewBox="0 0 24 24">
      <path d="M19 12H5m6-6-6 6 6 6"/>
    </symbol>
    <symbol id="icon-search" viewBox="0 0 24 24">
      <circle cx="10.5" cy="10.5" r="5.5"/>
      <path d="m15 15 4.5 4.5"/>
    </symbol>
    <symbol id="icon-close" viewBox="0 0 24 24">
      <path d="m6 6 12 12M18 6 6 18"/>
    </symbol>
    <symbol id="icon-chevron" viewBox="0 0 24 24">
      <path d="m9 6 6 6-6 6"/>
    </symbol>
  </svg>

  <div class="app-shell">
    <header class="appbar">
      <div class="product-brand">
        <span class="brand-mark"><svg class="icon" aria-hidden="true"><use href="#icon-mark"></use></svg></span>
        <strong>Pot Client</strong>
      </div>
      <nav aria-label="Main">
        <button id="worlds-nav" class="tool-button" type="button" aria-current="page">
          <svg class="icon" aria-hidden="true"><use href="#icon-grid"></use></svg>Worlds
        </button>
      </nav>
      <button id="controls-nav" class="tool-button controls-button" type="button">
        <svg class="icon" aria-hidden="true"><use href="#icon-keyboard"></use></svg>Controls
      </button>
    </header>

    <main class="main-panel">
      <section id="library" class="library" aria-labelledby="library-title">
        <header class="page-heading">
          <h1 id="library-title">World library</h1>
          <span id="library-status" class="status" data-state="working" role="status">
            <span class="status-dot" aria-hidden="true"></span>
            <span id="library-status-text">Loading worlds</span>
          </span>
        </header>
        <div id="library-error" class="error-box" hidden>
          <p id="library-error-text" role="alert"></p>
          <button id="retry" class="button" type="button">Retry</button>
        </div>

        <div id="library-content" hidden>
          <section class="worlds" aria-label="Choose a world">
            <label class="search" id="search-box">
              <svg class="icon" aria-hidden="true"><use href="#icon-search"></use></svg>
              <input id="world-search" type="search" aria-label="Find a world" placeholder="Find a world">
            </label>
            <p id="empty-search" class="empty-state" hidden>No worlds match your search.</p>
            <div id="world-cards" class="world-cards"></div>
          </section>

          <section class="feature" aria-labelledby="feature-title">
            <div class="feature-preview world-preview">
              <img id="feature-thumbnail" alt="" hidden decoding="async">
            </div>
            <div class="feature-copy">
              <h2 id="feature-title"></h2>
              <p id="feature-description"></p>
              <div class="feature-actions">
                <button id="play-solo" class="button primary" type="button">
                  <svg class="icon" aria-hidden="true"><use href="#icon-play"></use></svg>Play solo
                </button>
                <button id="join-online" class="button" type="button">
                  <svg class="icon" aria-hidden="true"><use href="#icon-players"></use></svg><span id="join-label">Join local</span>
                </button>
              </div>
              <p id="launch-status" class="launch-status" role="status" hidden></p>
            </div>
          </section>
        </div>
      </section>

      <section id="game" class="game" aria-labelledby="world-title" hidden>
        <header class="page-heading game-heading">
          <div class="game-title-group">
            <button id="leave-world" class="button secondary back-button" type="button" aria-label="Leave world" title="Leave world (Esc)">
              <svg class="icon" aria-hidden="true"><use href="#icon-back"></use></svg>
            </button>
            <h1 id="world-title"></h1>
          </div>
          <span id="game-status" class="status" data-state="ready" role="status">
            <span class="status-dot" aria-hidden="true"></span>
            <span id="game-status-text"></span>
          </span>
        </header>

        <div id="game-content" class="game-content">
          <div class="stage">
            <div id="canvas-slot" class="canvas-slot"><canvas id="world-canvas" class="world-canvas" tabindex="0" aria-label="Play area"></canvas></div>
            <p id="play-error" class="play-error" role="alert" hidden></p>
          </div>
          <aside id="players-panel" class="players-panel" aria-labelledby="players-title" hidden>
            <div class="players-heading">
              <h2 id="players-title">Players</h2>
              <span id="player-count" class="player-count" aria-label="Player count">0</span>
            </div>
            <p id="players-status">Connecting…</p>
            <ul id="player-list"></ul>
          </aside>
        </div>
        <div class="controls-strip" aria-label="Game controls">
          <span><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> Move</span>
          <span><kbd>Space</kbd> Jump</span>
          <span>Drag to look</span>
          <span>Scroll to zoom</span>
          <span><kbd>Esc</kbd> Leave</span>
        </div>
      </section>
    </main>
  </div>

  <dialog id="controls-dialog" aria-labelledby="controls-title">
    <form method="dialog">
      <header class="dialog-heading">
        <h2 id="controls-title">Controls</h2>
        <button class="button secondary back-button" type="submit" aria-label="Close controls" autofocus>
          <svg class="icon" aria-hidden="true"><use href="#icon-close"></use></svg>
        </button>
      </header>
      <dl class="control-list">
        <div><dt>Move</dt><dd><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> or arrow keys</dd></div>
        <div><dt>Jump</dt><dd><kbd>Space</kbd></dd></div>
        <div><dt>Look</dt><dd>Click and drag</dd></div>
        <div><dt>Zoom</dt><dd>Scroll</dd></div>
        <div><dt>Leave world</dt><dd><kbd>Esc</kbd></dd></div>
      </dl>
    </form>
  </dialog>
</body>
</html>
