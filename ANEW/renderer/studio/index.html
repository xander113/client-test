<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'none'; object-src 'none'; base-uri 'none'">
  <title>Pot Studio</title>
  <link rel="stylesheet" href="./studio.css">
</head>
<body>
  <svg class="icon-sheet" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="icon-mark" viewBox="0 0 24 24">
      <path d="M6 13h12l-1.5 7h-9L6 13Z" fill="currentColor" stroke="none"/>
      <path d="M12 13c0-4 2.4-7 6-8M12 13c0-3-2-5.6-5-6.4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      <path d="M13 9c-1-4 2.4-7 7-7 .3 4.4-2.2 7.3-7 7ZM11 10C7 11 4 8.5 4 4.7c4 .2 7 2 7 5.3Z" fill="currentColor" stroke="none"/>
    </symbol>
    <symbol id="icon-new" viewBox="0 0 24 24">
      <path d="M13 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V10m-7-7 7 7m-7-7v7h7M9 15h6m-3-3v6"/>
    </symbol>
    <symbol id="icon-open" viewBox="0 0 24 24">
      <path d="M3 19V6a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v2m-1.1 9H3l3-8h15a1 1 0 0 1 .9 1.4L20 19Z"/>
    </symbol>
    <symbol id="icon-save" viewBox="0 0 24 24">
      <path d="M18 21H6a3 3 0 0 1-3-3V6a3 3 0 0 1 3-3h11l4 4v11a3 3 0 0 1-3 3ZM7 21v-7h10v7M8 3v6h8V3"/>
    </symbol>
    <symbol id="icon-undo" viewBox="0 0 24 24">
      <path d="M3 10h12a5 5 0 0 1 0 10h-4m-3-15-5 5 5 5"/>
    </symbol>
    <symbol id="icon-redo" viewBox="0 0 24 24">
      <path d="M21 10H9a5 5 0 0 0 0 10h4m3-15 5 5-5 5"/>
    </symbol>
    <symbol id="icon-box" viewBox="0 0 24 24">
      <path d="m12 3 8 4.5v9L12 21l-8-4.5v-9L12 3Zm0 9 8-4.5M12 12 4 7.5M12 12v9"/>
    </symbol>
    <symbol id="icon-sphere" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="8.5"/>
      <ellipse cx="12" cy="12" rx="8.5" ry="3.6"/>
      <path d="M12 3.5c2.1 2.5 3.2 5.3 3.2 8.5s-1.1 6-3.2 8.5"/>
    </symbol>
    <symbol id="icon-cylinder" viewBox="0 0 24 24">
      <ellipse cx="12" cy="6" rx="7.5" ry="2.8"/>
      <path d="M4.5 6v12c0 1.55 3.36 2.8 7.5 2.8s7.5-1.25 7.5-2.8V6"/>
    </symbol>
    <symbol id="icon-play" viewBox="0 0 24 24">
      <path d="M8 5a1 1 0 0 0-1.5.9v12.2a1 1 0 0 0 1.5.9l10.7-6.1a1 1 0 0 0 0-1.8L8 5Z" fill="currentColor" stroke="none"/>
    </symbol>
    <symbol id="icon-upload" viewBox="0 0 24 24">
      <path d="M12 16V3M7 8l5-5 5 5M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/>
    </symbol>
    <symbol id="icon-frame" viewBox="0 0 24 24">
      <path d="M9 4H4v5m11-5h5v5M4 15v5h5m11-5v5h-5"/>
      <circle cx="12" cy="12" r="2.4"/>
    </symbol>
    <symbol id="icon-duplicate" viewBox="0 0 24 24">
      <rect x="8" y="8" width="12" height="12" rx="2"/>
      <path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/>
    </symbol>
    <symbol id="icon-trash" viewBox="0 0 24 24">
      <path d="M4 7h16M9 7V4h6v3m3 0-1 13H7L6 7m4 4v5m4-5v5"/>
    </symbol>
    <symbol id="icon-world" viewBox="0 0 24 24">
      <path d="m3 17 5-8 4 5 3-4 6 7H3Z"/>
      <circle cx="16" cy="6" r="2"/>
    </symbol>
    <symbol id="icon-chevron" viewBox="0 0 24 24">
      <path d="m9 6 6 6-6 6"/>
    </symbol>
  </svg>

  <header class="app-header">
    <div class="brand">
      <span class="brand-mark"><svg class="icon" aria-hidden="true"><use href="#icon-mark"></use></svg></span>
      <strong>Pot Studio</strong>
    </div>
    <div id="document-label" class="document-label">
      <span id="world-title"></span>
      <span id="dirty-indicator" class="dirty-indicator" title="Unsaved changes" aria-label="Unsaved changes" hidden></span>
    </div>
    <div class="header-actions">
      <button type="button" class="button" data-action="publish"><svg class="icon" aria-hidden="true"><use href="#icon-upload"></use></svg>Publish</button>
      <button type="button" class="button primary" data-action="playtest"><svg class="icon" aria-hidden="true"><use href="#icon-play"></use></svg>Playtest</button>
    </div>
  </header>

  <nav class="toolbar" aria-label="Editing tools">
    <div class="toolbar-group">
      <button type="button" class="tool-button" data-action="new" title="New project"><svg class="icon" aria-hidden="true"><use href="#icon-new"></use></svg><span>New</span></button>
      <button type="button" class="tool-button" data-action="open" title="Open project (Ctrl/⌘+O)"><svg class="icon" aria-hidden="true"><use href="#icon-open"></use></svg><span>Open</span></button>
      <button type="button" class="tool-button" data-action="save" title="Save project (Ctrl/⌘+S)"><svg class="icon" aria-hidden="true"><use href="#icon-save"></use></svg><span>Save</span></button>
      <button type="button" class="tool-button" data-action="save-as" title="Save a copy (Ctrl/⌘+Shift+S)">Save As</button>
    </div>
    <div class="toolbar-group">
      <button type="button" class="tool-button icon-button" data-action="undo" title="Undo (Ctrl/⌘+Z)" aria-label="Undo"><svg class="icon" aria-hidden="true"><use href="#icon-undo"></use></svg></button>
      <button type="button" class="tool-button icon-button" data-action="redo" title="Redo (Ctrl/⌘+Shift+Z)" aria-label="Redo"><svg class="icon" aria-hidden="true"><use href="#icon-redo"></use></svg></button>
    </div>
    <div class="toolbar-group">
      <button type="button" class="tool-button primitive" data-action="add-box" title="Add box"><svg class="icon" aria-hidden="true"><use href="#icon-box"></use></svg><span>Box</span></button>
      <button type="button" class="tool-button primitive" data-action="add-sphere" title="Add sphere"><svg class="icon" aria-hidden="true"><use href="#icon-sphere"></use></svg><span>Sphere</span></button>
      <button type="button" class="tool-button primitive" data-action="add-cylinder" title="Add cylinder"><svg class="icon" aria-hidden="true"><use href="#icon-cylinder"></use></svg><span>Cylinder</span></button>
    </div>
  </nav>

  <main class="workspace">
    <section class="stage panel" aria-labelledby="scene-title">
      <div class="panel-header">
        <h1 id="scene-title">Scene</h1>
        <button type="button" class="tool-button" data-action="frame" title="Frame selection or scene (F)"><svg class="icon" aria-hidden="true"><use href="#icon-frame"></use></svg><span>Frame</span></button>
      </div>
      <div class="stage-viewport">
        <canvas id="viewport" aria-label="Editable 3D scene"></canvas>
        <div class="view-label" aria-hidden="true">Perspective</div>
        <div id="graphics-error" class="graphics-error" role="alert" hidden></div>
      </div>
      <div class="scene-help">
        <span><kbd>Drag</kbd> Orbit</span>
        <span><kbd>Right drag</kbd> Pan</span>
        <span><kbd>Scroll</kbd> Zoom</span>
        <span><kbd>F</kbd> Frame</span>
      </div>
    </section>

    <aside class="side-panels" aria-label="Scene editing">
      <section class="outliner panel" aria-labelledby="outliner-title">
        <div class="panel-header">
          <h2 id="outliner-title">Outliner</h2>
          <div class="panel-actions">
            <button type="button" class="tool-button icon-button" data-action="duplicate" title="Duplicate object (Ctrl/⌘+D)" aria-label="Duplicate object"><svg class="icon" aria-hidden="true"><use href="#icon-duplicate"></use></svg></button>
            <button type="button" class="tool-button icon-button delete-button" data-action="delete" title="Delete object (Delete)" aria-label="Delete object"><svg class="icon" aria-hidden="true"><use href="#icon-trash"></use></svg></button>
          </div>
        </div>
        <div class="outliner-scroll">
          <button type="button" id="select-world" class="outline-row" aria-pressed="true">
            <svg class="icon" aria-hidden="true"><use href="#icon-world"></use></svg>
            <span id="outliner-world"></span>
          </button>
          <details id="object-group" class="object-group" open>
            <summary><svg class="icon disclosure-icon" aria-hidden="true"><use href="#icon-chevron"></use></svg>Objects <span id="object-count" class="object-count"></span></summary>
            <ul id="object-list" aria-label="Scene objects"></ul>
            <p id="empty-objects" class="empty-objects" hidden>Use the toolbar to add a shape.</p>
          </details>
        </div>
      </section>
      <section class="inspector panel" aria-labelledby="inspector-title">
        <div class="panel-header"><h2 id="inspector-title">Properties</h2><span id="inspector-kind" class="inspector-kind"></span></div>
        <div id="inspector-body" class="inspector-body"></div>
      </section>
    </aside>
  </main>

  <footer class="status">
    <span id="status-dot" class="status-dot" aria-hidden="true"></span>
    <span id="status-text" role="status" aria-live="polite">Ready</span>
    <span id="network-status" class="network-status"></span>
  </footer>

  <dialog id="unsaved-dialog" aria-labelledby="unsaved-title">
    <form method="dialog">
      <h2 id="unsaved-title">Save your changes?</h2>
      <p>Save this project before leaving, or discard the unsaved changes.</p>
      <div class="dialog-actions">
        <button type="submit" class="button" value="cancel" autofocus>Cancel</button>
        <button type="submit" class="button danger" value="discard">Discard</button>
        <button type="submit" class="button primary" value="save">Save</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="./studio.js"></script>
</body>
</html>
